  />

  <!-- Top-Right Fold Flap Corner -->
  <path
    d="M 62 14 L 62 30 L 78 30 Z"
    fill="#0369a1"
    opacity="0.35"
  />

  <!-- Horizontal Receipt Text Lines -->
  <rect x="32" y="26" width="22" height="4.5" rx="2.25" fill="#ffffff" />
  <rect x="32" y="36" width="34" height="4.5" rx="2.25" fill="#ffffff" />
  <rect x="32" y="46" width="28" height="4.5" rx="2.25" fill="#ffffff" />

  <!-- Checkmark Badge & Slash Line -->
  <!-- Checkmark Path -->
  <path
    d="M 46 64 L 54 72 L 74 48"
    stroke="#ffffff"
    stroke-width="5"
